<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><title>Caméras</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0e14">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--g:rgba(14,18,27,.72);--bd:rgba(255,255,255,.14);--fg:#eef1f7;--mut:#9aa4b8;--ac:#ff6b35}
html,body{height:100%;margin:0;background:#0b0e14;color:var(--fg);font:16px -apple-system,system-ui,sans-serif}
#map{position:absolute;inset:0;background:#0b0e14}
.leaflet-container{font:inherit}.leaflet-control-attribution{background:#0008!important;color:#aaa!important;font-size:10px}.leaflet-control-attribution a{color:#ccc!important}
.glass{background:var(--g);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);border:1px solid var(--bd);box-shadow:0 8px 30px #0008}
.bar{position:absolute;z-index:1000;left:10px;right:10px;top:calc(env(safe-area-inset-top,0px) + 10px);display:flex;gap:8px;align-items:center}
.bar>*{border-radius:16px}
.cnt{flex:0 0 auto;padding:12px 14px;font-weight:600;font-size:15px}.cnt small{color:var(--mut);font-weight:400}
button{font:inherit;color:var(--fg);border:1px solid var(--bd);background:rgba(255,255,255,.08);border-radius:14px;padding:12px 14px;cursor:pointer}
button.p{background:linear-gradient(135deg,#ff6b35,#ff3d6e);border:0;font-weight:600;color:#fff;box-shadow:0 4px 16px #ff6b3559}
.bar button{flex:1;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.bar .ic{flex:0 0 52px;padding:12px 0}
#hint{position:absolute;z-index:1000;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 70px);padding:10px 16px;border-radius:999px;display:none;font-size:14px;white-space:nowrap}
.sheet{position:absolute;z-index:1001;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);border-radius:24px;padding:16px;display:none;max-height:78%;overflow:auto}
.sheet h3{margin:0 0 6px;font-size:18px}
label{display:flex;justify-content:space-between;margin-top:12px;font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}label b{color:var(--fg);text-transform:none;letter-spacing:0;font-size:15px}
input[type=range]{width:100%;accent-color:var(--ac);margin:6px 0 0}
input[type=text],select{width:100%;margin-top:6px;font:inherit;color:var(--fg);background:rgba(255,255,255,.08);border:1px solid var(--bd);border-radius:12px;padding:11px}
select option{color:#000}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.chip{padding:8px 12px;font-size:14px;display:flex;align-items:center;gap:7px;border-radius:999px}
.chip i{width:10px;height:10px;border-radius:50%;display:block}.chip.off{opacity:.35}
.r{display:flex;gap:8px;margin-top:16px}.r button{flex:1}
.dot{width:16px;height:16px;border-radius:50%;border:2.5px solid #fff;box-shadow:0 0 0 4px var(--c),0 0 18px var(--c)}
.dot{box-shadow:0 0 14px 2px var(--c)}
.note{font-size:12px;color:var(--mut);margin-top:8px}
</style></head><body>
<div id="map"></div>
<div class="bar">
 <div class="cnt glass"><span id="n">0</span> <small>caméras</small></div>
 <button class="p" id="add">+ Caméra</button>
 <button class="glass ic" id="loc">📍</button>
 <button class="glass ic" id="menu">☰</button>
</div>
<div id="hint" class="glass">Touchez la carte pour placer la caméra</div>

<div class="sheet glass" id="sheet">
 <h3 id="ttl">Nouvelle caméra</h3>
 <label>Type</label><select id="type"><option>Fixe</option><option>Dôme (360°)</option><option>Lecture de plaques</option><option>Autre</option></select>
 <label>Direction <b id="vd"></b></label><input type="range" id="dir" min="0" max="359" value="0">
 <button id="here" style="width:100%;margin-top:8px">🧭 Utiliser ma direction</button>
 <label>Ouverture <b id="va"></b></label><input type="range" id="fov" min="20" max="360" value="90">
 <label>Portée <b id="vr"></b></label><input type="range" id="rng" min="5" max="150" value="30">
 <label>Note</label><input type="text" id="note" placeholder="Ex. angle de la rue, poteau…" maxlength="140">
 <div class="r"><button class="p" id="save">Enregistrer</button><button id="cancel">Annuler</button><button id="del" style="display:none;color:#ff6b7a">Supprimer</button></div>
</div>

<div class="sheet glass" id="mp">
 <h3>Réglages</h3>
 <label>Afficher</label><div class="chips" id="chips"></div>
 <label>Fond de carte</label><div class="chips"><button class="chip" id="b1">🌙 Sombre</button><button class="chip" id="b2">🗺️ Détaillé</button></div>
 <label>Données</label><div class="chips"><button class="chip" id="exp">⬆️ Exporter</button><button class="chip" id="imp">⬇️ Importer</button></div>
 <input type="file" id="file" accept=".json,application/json" style="display:none">
 <div class="r"><button class="p" id="mclose">Fermer</button></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const COL={'Fixe':'#ff6b35','Dôme (360°)':'#22d3ee','Lecture de plaques':'#facc15','Autre':'#a78bfa'};
const col=t=>COL[t]||'#ff6b35';
const map=L.map('map',{zoomControl:false,attributionControl:true}).setView([48.8566,2.3522],14);
const dark=L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{maxZoom:20,subdomains:'abcd',attribution:'© OpenStreetMap © CARTO'});
const std=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'});
let style=localStorage.getItem('style')||'dark';(style==='dark'?dark:std).addTo(map);
function setStyle(s){style=s;try{localStorage.setItem('style',s)}catch(e){}map.removeLayer(s==='dark'?std:dark);(s==='dark'?dark:std).addTo(map)}
let cams=[];try{cams=JSON.parse(localStorage.getItem('cams')||'[]')}catch(e){}
let hidden=new Set();try{hidden=new Set(JSON.parse(localStorage.getItem('hidden')||'[]'))}catch(e){}
const store=()=>{try{localStorage.setItem('cams',JSON.stringify(cams));localStorage.setItem('hidden',JSON.stringify([...hidden]))}catch(e){}};
const layer=L.layerGroup().addTo(map);
let placing=false,cur=null,prev=[],meMark=null,heading=0,mePos=null,watching=false,wantCenter=false,compass=false;

function cone(c,k,o){
 const R=c.rng*k,pts=[[c.lat,c.lon]],n=Math.max(4,Math.round(c.fov/6));
 if(c.fov>=360)return L.circle([c.lat,c.lon],{radius:R,...o});
 for(let i=0;i<=n;i++){const b=(c.dir-c.fov/2+c.fov*i/n)*Math.PI/180;
  pts.push([c.lat+R*Math.cos(b)/111320,c.lon+R*Math.sin(b)/(111320*Math.cos(c.lat*Math.PI/180))])}
 return L.polygon(pts,o);
}
function coneLayers(c){
 const C=col(c.type);
 return [cone(c,1,{color:C,weight:1,opacity:.7,fillColor:C,fillOpacity:.13,interactive:false}),
         cone(c,.55,{color:C,weight:0,fillColor:C,fillOpacity:.22,interactive:false})];
}
function dot(c,on){
 const m=L.marker([c.lat,c.lon],{icon:L.divIcon({className:'',iconSize:[22,22],iconAnchor:[11,11],html:'<div class="dot" style="--c:'+col(c.type)+'"></div>'})});
 if(on)m.on('click',()=>open(c,false));return m;
}
function draw(skip){
 layer.clearLayers();let n=0;
 cams.forEach(c=>{if(c===skip||hidden.has(c.type))return;n++;coneLayers(c).forEach(l=>l.addTo(layer));dot(c,!skip).addTo(layer)});
 $('n').textContent=cams.length;
}
function vals(){return{type:$('type').value,dir:+$('dir').value,fov:+$('fov').value,rng:+$('rng').value,note:$('note').value.trim()}}
function preview(){
 const v=vals();$('vd').textContent=v.dir+'°';$('va').textContent=v.fov+'°';$('vr').textContent=v.rng+' m';
 prev.forEach(l=>map.removeLayer(l));prev=[];
 if(cur){const c={...cur,...v};prev=coneLayers(c);prev.forEach(l=>l.addTo(map));prev.push(dot(c,false).addTo(map))}
}
['dir','fov','rng','note'].forEach(i=>$(i).oninput=preview);
$('type').onchange=()=>{if($('type').value.startsWith('Dôme'))$('fov').value=360;preview()};
$('here').onclick=()=>{startCompass();$('dir').value=Math.round(heading)%360;preview()};
function open(c,isNew){
 cur=c;placing=false;$('hint').style.display='none';$('mp').style.display='none';
 $('ttl').textContent=isNew?'Nouvelle caméra':'Modifier la caméra';
 $('type').value=c.type||'Fixe';$('dir').value=c.dir??Math.round(heading)%360;$('fov').value=c.fov??90;$('rng').value=c.rng??30;$('note').value=c.note||'';
 $('del').style.display=isNew?'none':'block';$('sheet').style.display='block';
 draw(c);preview();map.panTo([c.lat,c.lon]);
}
function close(){$('sheet').style.display='none';prev.forEach(l=>map.removeLayer(l));prev=[];cur=null;draw()}
$('add').onclick=()=>{placing=true;$('hint').style.display='block'};
map.on('click',e=>{if(placing)open({lat:e.latlng.lat,lon:e.latlng.lng},true)});
$('save').onclick=()=>{Object.assign(cur,vals());if(!cams.includes(cur)){cur.date=new Date().toISOString().slice(0,10);cams.push(cur)}store();close()};
$('cancel').onclick=close;
$('del').onclick=()=>{if(confirm('Supprimer cette caméra ?')){cams=cams.filter(x=>x!==cur);store();close()}};

function chips(){
 const b=$('chips');b.textContent='';
 Object.keys(COL).forEach(t=>{const x=document.createElement('button');x.className='chip'+(hidden.has(t)?' off':'');
  x.innerHTML='<i style="background:'+COL[t]+'"></i>'+t.replace(' (360°)','');
  x.onclick=()=>{hidden.has(t)?hidden.delete(t):hidden.add(t);store();chips();draw()};b.append(x)});
}
$('menu').onclick=()=>{chips();$('mp').style.display='block'};
$('mclose').onclick=()=>$('mp').style.display='none';
$('b1').onclick=()=>setStyle('dark');$('b2').onclick=()=>setStyle('std');
$('exp').onclick=()=>{const t=JSON.stringify(cams,null,1);
 if(navigator.share)navigator.share({title:'Caméras',text:t}).catch(()=>{});else prompt('Copiez vos données :',t)};
$('imp').onclick=()=>$('file').click();
$('file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{try{const a=JSON.parse(r.result);if(!Array.isArray(a))throw 0;
  a.forEach(c=>{if(c&&typeof c.lat==='number'&&typeof c.lon==='number'&&!cams.some(x=>x.lat===c.lat&&x.lon===c.lon))cams.push(c)});
  store();draw();alert('Import terminé.')}catch(x){alert('Fichier non valide.')}};r.readAsText(f)};

const arrowIcon=()=>L.divIcon({className:'',iconSize:[46,46],iconAnchor:[23,23],html:'<div id="arr" style="width:46px;height:46px;transform:rotate('+heading+'deg);filter:drop-shadow(0 0 8px #3b9cff)"><svg viewBox="0 0 44 44"><path d="M22 3 L34 36 L22 29 L10 36 Z" fill="#3b9cff" stroke="#fff" stroke-width="3" stroke-linejoin="round"/></svg></div>'});
function setMe(){
 if(!mePos)return;
 if(!meMark)meMark=L.marker(mePos,{icon:arrowIcon(),interactive:false,zIndexOffset:1000}).addTo(map);
 else{meMark.setLatLng(mePos);const a=document.getElementById('arr');if(a)a.style.transform='rotate('+heading+'deg)'}
}
function startCompass(){
 if(compass)return;compass=true;
 const on=e=>{let h=e.webkitCompassHeading;if(h==null&&e.absolute&&e.alpha!=null)h=360-e.alpha;if(h!=null){heading=h;setMe()}};
 const go=()=>{addEventListener('deviceorientation',on,true);addEventListener('deviceorientationabsolute',on,true)};
 if(typeof DeviceOrientationEvent!=='undefined'&&DeviceOrientationEvent.requestPermission)DeviceOrientationEvent.requestPermission().then(r=>{if(r==='granted')go();else compass=false}).catch(()=>{compass=false});
 else go();
}
$('loc').onclick=()=>{
 startCompass();
 if(!watching){watching=true;wantCenter=true;map.locate({watch:true,enableHighAccuracy:true})}
 else if(mePos)map.setView(mePos,Math.max(map.getZoom(),17));
};
map.on('locationfound',e=>{mePos=e.latlng;setMe();if(wantCenter){wantCenter=false;map.setView(mePos,17)}});
map.on('locationerror',()=>alert('Autorisez la localisation dans Safari.'));
draw();
if(cams.length)map.fitBounds(cams.map(c=>[c.lat,c.lon]),{maxZoom:17,padding:[60,60]});
else $('loc').click();
</script></body></html>
